site_name: Chisel OpenNPU Docs
repo_name: Chisel NPU

theme:
  name: material

nav:
  - Home: index.md
  - ISA Designs:
    - Instructions: designs/01.isa.md
    - Streamed dispatch (overview): designs/02.streamed-dispatch.md
    - Streamed issuing (detail): designs/04.streamed-issuing.md
    - Memory: designs/02.memory.md
    - Buses: designs/03.bus.md
  - Implementation:
    - Neural Core: implementations/NeuralCore.md
    - Processing Element: implementations/ProcessingElement.md
    - Systolic Array: implementations/SystolicArray.md
    - Vector ALU: implementations/VectorALU.md
    - Register Files: implementations/Registers.md
    - Quantization Pipeline: implementations/Quantization.md
    - Python Driver (chisel_npu_py): implementations/PythonDriver.md
    - Silicon Bring-up Log: implementations/SiliconBringup.md
    - FPGA Bring-up (Virtex UltraScale+ xcvu9p): implementations/FPGA_VU9P.md
    - FPGA Bring-up (Kintex-7 xc7k480t): implementations/FPGA_XC7K480T.md
  - Tutorials:
    - GEMM + Softmax Quantization: tutorials/gemm_softmax_quantization.md

plugins:
    - search
    - mermaid2

markdown_extensions:
  - admonition
  - markdown_wavedrom
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/wavedrom/2.6.8/wavedrom.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/wavedrom/2.6.8/skins/default.js
  - js/wavedrom_loader.js
  - js/mathjax_helper.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
